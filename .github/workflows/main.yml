name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack zip (if the project is uploaded as an archive)
        run: |
          if [ ! -f pom.xml ]; then
            ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "::error::No pom.xml and no .zip archive found in the repository"
              exit 1
            fi
            echo "Unpacking $ZIP"
            mkdir -p _unpacked
            unzip -q "$ZIP" -d _unpacked
          fi

      - name: Locate project directory
        id: proj
        run: |
          POM=$(find . -name pom.xml -not -path './.git/*' | head -n 1)
          if [ -z "$POM" ]; then
            echo "::error::pom.xml not found"
            exit 1
          fi
          DIR=$(dirname "$POM")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        working-directory: ${{ steps.proj.outputs.dir }}
        run: mvn -B -ntp clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: GoldenCelestialEffect
          path: ${{ steps.proj.outputs.dir }}/target/GoldenCelestialEffect.jar
          if-no-files-found: error

      - name: Publish release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/target/GoldenCelestialEffect.jar
